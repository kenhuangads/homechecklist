<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="全家共用的家電採購與安裝需求清單：方案比較、價格與比價、待辦、修改紀錄與還原；設計師版只看尺寸與安裝需求。">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#C8612E">

<meta name="apple-mobile-web-app-title" content="翻修清單">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Huninn&display=swap">
<style>
/* ===== 南投老家翻修清單 v2 — 「藍釉與磚」 =====
   Tokens: light on :root; dark via guarded media query + data-theme. Base 19px, rem everywhere. */
:root {
  --bg: #F7F1E8; --surface: #FFFCF7; --surface-2: #F3EBDF; --surface-3: #E9DECD;
  --ink: #2E2722; --ink-2: #685B50; --ink-3: #9A8B7E; --line: #E8DDCE; --line-strong: #CDBFAE;
  --accent: #C8612E; --accent-ink: #FFFFFF; --accent-soft: #FBE6D8; --accent-deep: #9E4A1F;
  --attn: #B9770E; --attn-soft: #FCF0D6; --ok: #3E7D4F; --ok-soft: #E1F0E3; --danger: #B3261E; --danger-soft: #F9E1DE;
  --r-kitchen: #FBE3C3; --r-water: #D8ECEF; --r-bath: #DDEFE0; --r-living: #ECE2F2; --r-entry: #F0E6D3; --r-hvac: #E2E9F3; --r-next: #FBE6D8;
  --shadow: 0 1px 2px rgba(70,45,25,.05), 0 6px 18px rgba(70,45,25,.07);
  --radius: 20px; --radius-sm: 14px; --tap: 3.3rem;
  --display: "Huninn", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1814; --surface: #29221D; --surface-2: #342B25; --surface-3: #40352E;
    --ink: #F3ECE3; --ink-2: #C4B6A8; --ink-3: #94867A; --line: #3E342D; --line-strong: #574A41;
    --accent: #F0915E; --accent-ink: #2A1609; --accent-soft: #4A2B1A; --accent-deep: #F7B48C;
    --attn: #E0A43A; --attn-soft: #3F311A; --ok: #6DC48A; --ok-soft: #1F3A28; --danger: #F49A93; --danger-soft: #3E1C1A;
    --r-kitchen: #4A3A22; --r-water: #233A40; --r-bath: #253D2C; --r-living: #3A2E44; --r-entry: #3F3526; --r-hvac: #2C3542; --r-next: #4A2B1A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1814; --surface: #29221D; --surface-2: #342B25; --surface-3: #40352E;
  --ink: #F3ECE3; --ink-2: #C4B6A8; --ink-3: #94867A; --line: #3E342D; --line-strong: #574A41;
  --accent: #F0915E; --accent-ink: #2A1609; --accent-soft: #4A2B1A; --accent-deep: #F7B48C;
  --attn: #E0A43A; --attn-soft: #3F311A; --ok: #6DC48A; --ok-soft: #1F3A28; --danger: #F49A93; --danger-soft: #3E1C1A;
  --r-kitchen: #4A3A22; --r-water: #233A40; --r-bath: #253D2C; --r-living: #3A2E44; --r-entry: #3F3526; --r-hvac: #2C3542; --r-next: #4A2B1A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}
html { font-size: 19px; -webkit-text-size-adjust: 100%; }
html[data-font="lg"] { font-size: 21.5px; }
html[data-font="xl"] { font-size: 24px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-wrap: anywhere; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-deep); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
p { margin: 0; } ul { margin: 0; padding-left: 1.2em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
[hidden] { display: none !important; }

/* ---- shell ---- */
.app { max-width: 720px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem; min-height: var(--tap); padding: .35rem .6rem; padding-top: calc(.35rem + env(safe-area-inset-top)); }
.topbar h1 { font-size: 1.1rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.topbar .back { justify-self: start; } .topbar .right { justify-self: end; display: flex; gap: .3rem; align-items: center; }
.save-state { font-size: .78rem; color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .55rem; border-radius: 999px; border: 0; background: transparent; cursor: pointer; }
.save-state[data-s="saving"] { color: var(--attn); background: var(--attn-soft); }
.save-state[data-s="saved"] { color: var(--ok); background: var(--ok-soft); }
.save-state[data-s="error"] { color: var(--danger); background: var(--danger-soft); }
.save-state[data-s="local"], .save-state[data-s="readonly"] { color: var(--ink-2); background: var(--surface-2); }
main.content { flex: 1; padding: .9rem .9rem calc(5.4rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .95rem; }
.doc-mode main.content { padding-bottom: 2rem; }
.tabbar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -4px 16px rgba(27,36,48,.06); }
.tabbar .inner { max-width: 720px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabbar button { appearance: none; background: none; border: 0; cursor: pointer; min-height: 4.1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; color: var(--ink-2); font-size: .86rem; font-weight: 600; padding: .35rem 0; position: relative; }
.tabbar button svg { width: 1.55rem; height: 1.55rem; }
.tabbar button[aria-current="page"] { color: var(--accent-deep); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: .35rem; width: 3rem; height: 2.1rem; border-radius: 999px; background: var(--accent-soft); z-index: -1; }
.tabbar button .badge { position: absolute; top: .3rem; right: calc(50% - 1.9rem); min-width: 1.3rem; height: 1.3rem; border-radius: 999px; background: var(--attn); color: #fff; font-size: .7rem; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; padding: 0 .3rem; }

/* ---- type ---- */
.serif { font-family: var(--display); }
.h-hero { font-family: var(--display); font-size: 1.85rem; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
.h-room { font-family: var(--display); font-size: 1.3rem; font-weight: 900; display: flex; align-items: baseline; gap: .6rem; }
.h-room .count { font-family: var(--sans); font-size: .82rem; font-weight: 600; color: var(--ink-3); }
.h-sec { font-size: 1.12rem; font-weight: 800; display: flex; align-items: center; gap: .5rem; }
.h-sec .count { font-size: .85rem; font-weight: 600; color: var(--ink-3); }
.eyebrow { font-size: .76rem; font-weight: 800; letter-spacing: .1em; color: var(--ink-3); }
.muted { color: var(--ink-2); } .small { font-size: .88rem; } .tiny { font-size: .78rem; color: var(--ink-3); }
.price { font-weight: 900; font-size: 1.2rem; letter-spacing: -.01em; }

/* ---- surfaces ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .65rem; }
.card.flat { box-shadow: none; }
.card.tone-attn { border-color: color-mix(in srgb, var(--attn) 45%, var(--line)); background: var(--attn-soft); }
.card.tone-accent { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: var(--accent-soft); }
.card.tone-ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); background: var(--ok-soft); }
.stack { display: flex; flex-direction: column; gap: .65rem; } .stack-sm { display: flex; flex-direction: column; gap: .4rem; }
.row { display: flex; align-items: center; gap: .6rem; } .row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.top { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; } @media (max-width: 380px) { .grid-2 { grid-template-columns: 1fr; } }

/* hero */
.hero { background: linear-gradient(135deg, #B8552A, #D9753F 62%, #EEA56E); color: #fff; border-radius: var(--radius); padding: 1.1rem 1.1rem 1rem; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: .8rem; align-items: center; }
:root[data-theme="dark"] .hero, .hero.dark { color: #fff; }
.hero .eyebrow { color: rgba(255,255,255,.75); }
.hero .h-hero { color: #fff; }
.hero .sub { color: rgba(255,255,255,.85); font-size: .9rem; margin-top: .25rem; }
.ring { --p: 0; width: 5.4rem; height: 5.4rem; border-radius: 50%; background: conic-gradient(#fff calc(var(--p) * 1%), rgba(255,255,255,.25) 0); display: grid; place-items: center; position: relative; }
.ring::after { content: ""; position: absolute; inset: .5rem; border-radius: 50%; background: #B8552A; }
.ring span { position: relative; z-index: 1; font-weight: 900; font-size: 1.05rem; text-align: center; line-height: 1.15; }
.ring span small { display: block; font-size: .66rem; font-weight: 600; opacity: .85; }
.hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; margin-top: .5rem; grid-column: 1 / -1; }
.hero-actions .btn { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.35); min-width: 0; padding: .3rem .4rem; font-size: .86rem; white-space: nowrap; gap: .3rem; }
.hero-actions .btn svg { width: 1.05rem; height: 1.05rem; }

/* next-step card */
.next { border-left: 0; }
.next .t { font-weight: 800; font-size: 1.08rem; }

/* item cards */
.item-row { appearance: none; text-align: left; width: 100%; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem .85rem; box-shadow: var(--shadow); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .75rem; color: inherit; }
.item-row:active { background: var(--surface-2); }
.tile { width: 3.2rem; height: 3.2rem; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--ink); }
.tile svg { width: 1.9rem; height: 1.9rem; }
.tile.r-kitchen { background: var(--r-kitchen); } .tile.r-water { background: var(--r-water); } .tile.r-bath { background: var(--r-bath); } .tile.r-living { background: var(--r-living); } .tile.r-entry { background: var(--r-entry); } .tile.r-hvac { background: var(--r-hvac); } .tile.r-next { background: var(--r-next); color: var(--accent-deep); }
.item-row .title { font-size: 1.12rem; font-weight: 800; }
.item-row .sub { color: var(--ink-2); font-size: .9rem; margin-top: .1rem; }
.item-row .meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; align-items: center; }
.item-row .arrow { color: var(--ink-3); width: 1.4rem; height: 1.4rem; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .16rem .62rem; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.35; }
.chip.s-choosing { background: var(--attn-soft); color: var(--attn); }
.chip.s-decided { background: var(--accent-soft); color: var(--accent-deep); }
.chip.s-bought, .chip.s-installed { background: var(--ok-soft); color: var(--ok); }
.chip.s-skipped { background: var(--surface-2); color: var(--ink-3); }
.chip.tier { border: 1px solid var(--line); background: var(--surface); }
.chip.pick { background: var(--accent); color: var(--accent-ink); }
.chip.tag { font-size: .76rem; padding: .1rem .5rem; border: 1px solid var(--line); background: var(--surface); }
.chip.src { border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.chip.warn { background: var(--danger-soft); color: var(--danger); }
.chip.live { background: var(--ok-soft); color: var(--ok); }
.tag-電 { background: #FFF0C2 !important; color: #7A5200 !important; border-color: #F0D88A !important; }
.tag-水, .tag-排水 { background: #DCEFFB !important; color: #0B5A85 !important; border-color: #B3D9F0 !important; }
.tag-排風 { background: #E3F4EA !important; color: #1E6B3F !important; border-color: #B9DFC7 !important; }
.tag-尺寸 { background: #ECE6F8 !important; color: #5A3A9A !important; border-color: #D3C6EC !important; }
.tag-搬運 { background: #F8E6DA !important; color: #8E4A12 !important; border-color: #EBC7AE !important; }
.tag-木作 { background: #F3EAD9 !important; color: #6F4E13 !important; border-color: #E1CFA6 !important; }
.tag-其他 { background: var(--surface-2) !important; color: var(--ink-2) !important; }
:root[data-theme="dark"] [class*="tag-"] { background: var(--surface-2) !important; color: var(--ink) !important; border-color: var(--line-strong) !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [class*="tag-"] { background: var(--surface-2) !important; color: var(--ink) !important; border-color: var(--line-strong) !important; } }

/* buttons */
.btn { appearance: none; border: 2px solid transparent; cursor: pointer; border-radius: var(--radius-sm); min-height: var(--tap); padding: .55rem 1rem; font-size: 1.02rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; line-height: 1.25; background: var(--surface-2); color: var(--ink); }
.btn svg { width: 1.25rem; height: 1.25rem; flex: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.outline { background: var(--surface); border-color: var(--accent); color: var(--accent-deep); }
.btn.ghost { background: transparent; color: var(--accent-deep); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.block { width: 100%; } .btn.sm { min-height: 2.45rem; padding: .3rem .75rem; font-size: .9rem; border-radius: 9px; } .btn.lg { min-height: 3.7rem; font-size: 1.12rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: .5rem; flex-wrap: wrap; } .btn-row > .btn { flex: 1 1 auto; }
.linkbtn { appearance: none; background: none; border: 0; padding: .3rem 0; color: var(--accent-deep); font-weight: 700; cursor: pointer; font-size: .95rem; min-height: 2.4rem; }
.lnk-momo { background: #FBE4EC; color: #B0124B; } .lnk-pchome { background: #FDE6E3; color: #C22E1A; } .lnk-official { background: var(--surface-2); color: var(--ink); } .lnk-other { background: var(--surface-2); color: var(--ink); }
.lnk-search { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
.lnk-cmp { background: #FFF4D6; color: #7A4E00; border-color: #F2DFA6; }
:root[data-theme="dark"] .lnk-momo { background: #3A1A27; color: #F6A3C2; } :root[data-theme="dark"] .lnk-pchome { background: #3A1D1A; color: #F7A79B; } :root[data-theme="dark"] .lnk-cmp { background: #3B3015; color: #F2D48A; border-color: #5A4A22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lnk-momo { background: #3A1A27; color: #F6A3C2; } :root:not([data-theme="light"]) .lnk-pchome { background: #3A1D1A; color: #F7A79B; } :root:not([data-theme="light"]) .lnk-cmp { background: #3B3015; color: #F2D48A; border-color: #5A4A22; } }
.link-row { display: flex; flex-wrap: wrap; gap: .45rem; } .link-row .btn { flex: 1 1 8rem; }

/* status grid */
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.status-grid .btn { min-height: 3.5rem; flex-direction: column; gap: .1rem; border-color: var(--line); background: var(--surface); font-size: 1rem; }
.status-grid .btn .hint { font-size: .75rem; font-weight: 500; color: var(--ink-3); }
.status-grid .btn[aria-pressed="true"] { border-width: 2px; }
.status-grid .btn.s-choosing[aria-pressed="true"] { border-color: var(--attn); background: var(--attn-soft); color: var(--attn); }
.status-grid .btn.s-decided[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }
.status-grid .btn.s-bought[aria-pressed="true"], .status-grid .btn.s-installed[aria-pressed="true"] { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.status-grid .btn[aria-pressed="true"] .hint { color: inherit; }

/* check rows */
.check-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .7rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .55rem .7rem; min-height: var(--tap); }
.check-row .box { width: 1.8rem; height: 1.8rem; border: 2.5px solid var(--line-strong); border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); color: #fff; flex: none; }
.check-row .box svg { width: 1.2rem; height: 1.2rem; }
.check-row[data-done="true"] .box { background: var(--ok); border-color: var(--ok); }
.check-row[data-done="true"] .label { color: var(--ink-3); text-decoration: line-through; }
.check-row .label { font-size: 1.02rem; font-weight: 500; } .check-row .ctx { font-size: .78rem; color: var(--ink-3); margin-top: .1rem; }
.check-row button.toggle { appearance: none; background: none; border: 0; padding: 0; display: contents; cursor: pointer; }
.check-row .del { appearance: none; background: none; border: 0; color: var(--ink-3); padding: .4rem; cursor: pointer; min-width: 2.4rem; min-height: 2.4rem; border-radius: 8px; }

/* option card */
.opt { border: 1.5px solid var(--line); border-radius: var(--radius); padding: .85rem; background: var(--surface); display: flex; flex-direction: column; gap: .55rem; }
.opt.chosen { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.opt.picked { border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
.opt .model { font-size: 1.12rem; font-weight: 800; } .opt .name { color: var(--ink-2); font-size: .9rem; }
.opt ul.hl { padding-left: 1.1em; color: var(--ink); font-size: .95rem; display: flex; flex-direction: column; gap: .15rem; }
.opt ul.hl li::marker { color: var(--accent); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .7rem; font-size: .9rem; } .kv dt { color: var(--ink-3); font-weight: 600; white-space: nowrap; } .kv dd { margin: 0; }
.pick-reason { background: var(--accent-soft); color: var(--accent-deep); border-radius: 10px; padding: .45rem .65rem; font-size: .9rem; font-weight: 600; }

/* install */
.inst { display: flex; gap: .55rem; align-items: flex-start; padding: .45rem 0; border-top: 1px solid var(--line); } .inst:first-child { border-top: 0; } .inst .chip { margin-top: .15rem; } .inst .t { font-size: .96rem; }

/* notes */
.note { background: var(--surface-2); border-radius: var(--radius-sm); padding: .6rem .75rem; } .note .who { font-weight: 700; } .note .when { color: var(--ink-3); font-size: .78rem; } .note .txt { margin-top: .2rem; white-space: pre-wrap; }

/* forms */
.field { display: flex; flex-direction: column; gap: .3rem; } .field label { font-weight: 700; font-size: .95rem; } .field .help { font-size: .82rem; color: var(--ink-3); }
.input { width: 100%; min-height: var(--tap); border: 2px solid var(--line-strong); border-radius: var(--radius-sm); padding: .5rem .75rem; background: var(--surface); font-size: 1.02rem; }
.input:focus { border-color: var(--accent); outline: none; } textarea.input { min-height: 5.5rem; resize: vertical; line-height: 1.5; }
.seg { display: flex; gap: .4rem; flex-wrap: wrap; } .seg .btn { flex: 1 1 auto; border-color: var(--line); background: var(--surface); } .seg .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-deep); }

async function loadConfig() {

function mockApi(p) {

  if (p.action === 'load') return { ok: true, state: db.state, rev: db.state ? db.state.rev : 0 };
  if (p.action === 'save') {
    const cur = db.state ? db.state.rev : 0;

    const need = localStorage.getItem('hc_mock_code'); if (need && String(p.code || '') !== need) return { ok: false, error: 'code_required' };

async function apiCall(params, body) {

    return await r.json();
  } finally { clearTimeout(t); }
}
function setSave(s, msg) {
  saveState = { s, msg: msg || '' };
  const el = $('#saveState'); if (el) renderSaveState(el);
  if (s === 'saved' || s === 'saving') document.querySelectorAll('.pending-banner').forEach(b => b.remove());
  if (s === 'error' || s === 'local') { const host = $('main.content'); if (host && !$('.pending-banner') && pending.length) host.prepend(pendingBanner()); }
}
function scheduleSave() { if (!canEdit()) return; clearTimeout(saveTimer); setSave('saving', '儲存中…'); saveTimer = setTimeout(saveNow, saveDelay); }

function retrySoon(ms) { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, ms + Math.random() * 1500); }
async function saveNow() {
  if (!state || !canEdit()) return;
  if (!API.configured) { setSave('local', '尚未連線雲端，修改先留在這台裝置'); return; }
  if (saving) { dirtyAgain = true; return; }
  saving = true; setSave('saving', '儲存中…');
  try {
    const entries = state.history.filter(e => pending.some(a => a._ctx && a._ctx.id === e.id));
    const res = await apiCall({ action: 'save' }, { state, baseRev: syncedRev, code: API.code, entries, who: me && me.name, device: deviceName() });
    if (res && res.ok) { syncedRev = res.rev; state.rev = res.rev; pending = []; store.set(KEYS.pending, pending); lastSyncAt = nowIso(); remoteStatus = 'ok'; setSave('saved', '已儲存到雲端 ' + fmtTime(lastSyncAt)); }
    else if (res && res.conflict) { adoptRemote(res.state, { initial: false, quiet: true }); dirtyAgain = pending.length > 0; if (!dirtyAgain) setSave('saved', '已同步'); }
    else if (res && res.error === 'code_required') { setSave('error', '需要家庭代碼才能存到雲端'); askFamilyCode(); }
    else if (res && res.error === 'busy') { setSave('saving', '雲端忙碌中，稍後再試'); retrySoon(3000); }

  } catch (e) { remoteStatus = 'offline'; setSave('error', '連不上雲端，稍後會自動再試'); retrySoon(6000); }

}
function adoptRemote(remote, { initial, quiet } = {}) {
  remote = normalize(clone(remote));

  if (seed && (seed.catalogVersion || 0) > (remote.catalogVersion || 0)) { mergeCatalog(remote, seed); upgraded = true; }
  const newEntries = state ? remote.history.filter(e => !state.history.some(x => x.id === e.id)) : [];
  const todo = pending.filter(a => a._ctx && !remote.history.some(e => e.id === a._ctx.id));

  pending = todo; store.set(KEYS.pending, pending);
  if (upgraded) { state.rev++; state.updatedAt = nowIso(); }
  store.set(KEYS.backup, { savedAt: nowIso(), state });
  render();
  if (!initial && !quiet && newEntries.length) { const last = newEntries[newEntries.length - 1]; toast(`${last.who}：${last.summary}`.slice(0, 48)); }
  if ((pending.length || upgraded) && canEdit()) scheduleSave();
}
async function syncFromRemote(initial) {
  if (!API.configured) { remoteStatus = 'noapi'; return; }
  try {
    const res = await apiCall({ action: 'load' });
    if (!res || !res.ok) throw new Error(res && res.error);
    lastSyncAt = nowIso();
    if (!res.state) { remoteStatus = 'none'; syncedRev = 0; if (canEdit()) scheduleSave(); return; }
    remoteStatus = 'ok';
    if (!state || res.state.rev !== state.rev || initial) adoptRemote(res.state, { initial: !!initial, quiet: !!initial });
  } catch (e) { remoteStatus = 'offline'; }
  const el = $('#saveState'); if (el) renderSaveState(el);
}
async function pollRemote() {
  if (!API.configured || saving || pending.length || !state) return;
  if (Date.now() - lastPollAt < 8000) return; lastPollAt = Date.now();
  try { const res = await apiCall({ action: 'load' }); if (res && res.ok) { lastSyncAt = nowIso(); remoteStatus = res.state ? 'ok' : 'none'; if (res.state && res.state.rev > state.rev) adoptRemote(res.state, { initial: false }); } } catch { remoteStatus = 'offline'; }
}
function startPolling() {
  setInterval(() => { if (document.visibilityState === 'visible') pollRemote(); }, 45000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pollRemote(); else flushSave(); });
  window.addEventListener('focus', () => pollRemote());

}

      h('div', { class: 'grid-2' }, h('div', { class: 'field' }, h('label', {}, '價格'), price), h('div', { class: 'field' }, h('label', {}, '備註'), note)),
      h('div', { class: 'toggle-row' }, h('span', {}, '請 Claude 幫忙查最新價格與規格'), ask)),

        price: v > 0 ? { amount: v, min: v, max: v, source: p ? p.type : 'family', checkedAt: todayIso(), note: `${me.name} 回報` } : { amount: null, min: null, max: null, source: 'family', checkedAt: todayIso(), note: '價格待查' },
        links, note: note.value.trim(), addedBy: me.name, addedAt: nowIso(), keyword: kw.value.trim(), availability: '' };

/* ---------- cloud snapshots ---------- */
async function openSnapshotsSheet() {
  const list = h('div', { class: 'stack-sm' }, h('p', { class: 'muted' }, '載入中…'));
  openSheet({ title: '雲端快照', body: () => h('div', { class: 'stack' }, h('p', { class: 'small muted' }, '每次儲存都會在 Google 雲端硬碟留一份完整快照（最近 200 份）。選一份可以整份回復；回復本身也會留下紀錄。'), list), actions: [{ label: '關閉' }] });
  try {
    const res = await apiCall({ action: 'snapshots' });
    list.replaceChildren();
    if (!res || !res.ok || !res.snapshots || !res.snapshots.length) { list.append(h('p', { class: 'muted' }, '目前沒有快照。')); return; }
    res.snapshots.slice(0, 40).forEach(s => list.append(h('div', { class: 'row between', style: 'border-top:1px solid var(--line);padding:.4rem 0' }, h('div', {}, h('div', { style: 'font-weight:700' }, `第 ${s.rev} 版`), h('div', { class: 'tiny' }, fmtTime(s.at, true))),
      h('button', { class: 'btn sm', type: 'button', disabled: !canEdit() || s.rev === state.rev, onclick: async () => {
        if (!await confirmDialog({ title: `回復到第 ${s.rev} 版？`, text: '會以那一份快照覆蓋目前所有內容（之後的修改都會被取代，但會留下紀錄）。', ok: '回復', danger: true })) return;
        try { const r = await apiCall({ action: 'snapshot', rev: s.rev }); if (!r || !r.ok) throw new Error('not ok'); const snap = normalize(clone(r.state)); const keepHistory = state.history; state = snap; state.history = keepHistory; dispatch({ type: 'replaceState', summary: `以雲端快照第 ${s.rev} 版覆蓋全部內容` }, { force: true }); closeSheet(); toast(`已回復到第 ${s.rev} 版`); } catch (e) { toast('讀取快照失敗'); }
      } }, '回復'))));
  } catch (e) { list.replaceChildren(h('p', { class: 'muted' }, '連不上雲端。')); }
}

/* ---------- boot ---------- */
async function boot() {
  refineDeviceModel();
  const app = $('#app');
  app.replaceChildren(h('main', { class: 'content' }, h('div', { class: 'card' }, h('p', { class: 'muted' }, '載入清單中…'))));
  const seed = readSeed();
  state = normalize(clone(seed || { schema: 1, rev: 0, meta: {}, profiles: {}, rooms: [], items: [], prep: [], history: [] }));
  const backup = store.get(KEYS.backup);
  if (backup && backup.state && (backup.state.rev || 0) > (state.rev || 0) && (backup.state.catalogVersion || 0) >= (seed.catalogVersion || 0)) state = normalize(backup.state);
  const savedRoute = sstore.get(KEYS.route); if (savedRoute && savedRoute.screen) route = savedRoute;
  render();
  await Promise.all([loadConfig(), loadPrices()]);
  if (pending.length && canEdit()) { const existing = new Set(state.history.map(e => e.id)); const todo = pending.filter(a => a._ctx && !existing.has(a._ctx.id)); pending = []; todo.forEach(a => dispatch(a, { replay: true, silent: true, force: true })); pending = todo; store.set(KEYS.pending, pending); }
  render();
  await syncFromRemote(true);
  render();
  startPolling();
  const sh = sstore.get(KEYS.sheet);
  if (sh && Date.now() - sh.at < 120000 && role === 'family' && me) { const [kind, arg] = sh.name.split(':'); try { if (kind === 'note' && item(arg)) openNoteSheet(arg); else if (kind === 'add' && item(arg)) openAddProductSheet(item(arg)); else if (kind === 'todo') openAddTodoSheet(arg === 'general' ? null : arg); } catch {} }
  if (role === 'family' && me && !store.get(KEYS.tut)) showTutorial('family');
  if (pending.length && canEdit()) scheduleSave();
}
document.addEventListener('DOMContentLoaded', boot);
